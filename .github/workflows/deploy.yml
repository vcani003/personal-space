# Deploys the site to GitHub Pages on every push to `main`.
#
# NOT YET ENABLED. This file is written; the repository, the first push and
# the Pages settings are the site owner's to approve. Before the first run:
#
#   1. Repository → Settings → Pages → Build and deployment → Source:
#      "GitHub Actions". Without this the workflow fails at the deploy step.
#   2. Confirm nothing licensed is being published. PP Eiko is gitignored, so
#      CI builds without it and the site renders the fallback serif stack
#      declared in src/styles/fonts.css. That is correct until a licence is
#      bought. If Eiko files ever appear in a build here, stop.
#
# The site now has routing, so the build emits a `404.html` that is a copy of
# `index.html` — see `spaFallback()` in vite.config.ts. GitHub Pages serves it
# for any unresolved path with the URL intact, which is what makes a deep link
# to a project page work on a host that only serves files.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # The subpath is derived from the repository name, never hardcoded, so
        # renaming or forking the repo needs no code change. `vite.config.ts`
        # is the only place it is read. GITHUB_REPOSITORY is "owner/name".
        run: |
          export BASE_PATH="${GITHUB_REPOSITORY#*/}"
          echo "Building with base /$BASE_PATH/"
          npm run build

      # ---------------------------------------------------------------------
      # SPATIAL — a separate repository, composed in at DEPLOY time
      # ---------------------------------------------------------------------
      # The application source is deliberately NOT vendored into this
      # repository and is not a dependency in package.json. It is checked out,
      # built with a base path pointing at where it will be served, and copied
      # into the site's output. The two codebases never meet; only their built
      # artifacts do.
      #
      # WHAT MAKES THIS REPLACEABLE, which is the point: the only thing this
      # site tells Spatial is BASE_PATH. If Spatial ever moves to its own
      # domain, these two steps are deleted and the link in
      # `src/projects/Spatial.tsx` changes. Nothing inside either application
      # is restructured.
      #
      # PRECONDITION: the Spatial repository must exist and be public under
      # the same owner. Until it is pushed, THESE STEPS FAIL THE DEPLOY —
      # loudly and on purpose. The alternative, `continue-on-error`, would
      # publish a case study whose "open the canvas" link 404s, which is
      # exactly the dead end the site should not ship.
      - name: Check out Spatial
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/spatial
          ref: main
          path: .spatial-src

      - name: Build Spatial into /projects/spatial/app
        working-directory: .spatial-src
        # The base is this site's own subpath plus where the app is mounted,
        # derived from the repository name exactly as the site's own build is.
        run: |
          export BASE_PATH="${GITHUB_REPOSITORY#*/}/projects/spatial/app"
          echo "Building Spatial with base /$BASE_PATH/"
          npm ci
          npm run build

      - name: Copy Spatial into the site output
        run: |
          mkdir -p dist/projects/spatial/app
          cp -R .spatial-src/dist/. dist/projects/spatial/app/
          test -f dist/projects/spatial/app/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
