# Deploys the site to GitHub Pages on every push to `main`.
#
# NOT YET ENABLED. This file is written; the repository, the first push and
# the Pages settings are the site owner's to approve. Before the first run:
#
#   1. Repository → Settings → Pages → Build and deployment → Source:
#      "GitHub Actions". Without this the workflow fails at the deploy step.
#   2. Confirm nothing licensed is being published. PP Eiko is gitignored, so
#      CI builds without it and the site renders the fallback serif stack
#      declared in src/styles/fonts.css. That is correct until a licence is
#      bought. If Eiko files ever appear in a build here, stop.
#
# There is no SPA 404.html fallback and none is needed: one page, no routing.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # The subpath is derived from the repository name, never hardcoded, so
        # renaming or forking the repo needs no code change. `vite.config.ts`
        # is the only place it is read. GITHUB_REPOSITORY is "owner/name".
        run: |
          export BASE_PATH="${GITHUB_REPOSITORY#*/}"
          echo "Building with base /$BASE_PATH/"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
