<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The world is dark. This tells the browser before any CSS parses, so
      there is no white flash on load and form controls / scrollbars render
      dark. It is not a palette decision — the palette lives in tokens.css.
    -->
    <meta name="color-scheme" content="dark" />

    <!--
      TODO (lead): favicon and meta description.
      The Vite template favicon has been removed rather than shipped. There is
      deliberately no <link rel="icon"> here: a missing icon is a harmless
      404, a wrong one is a brand decision made by accident.
      No third-party font <link> belongs in this file. Fonts are self-hosted
      in src/styles/fonts.css.
    -->

    <title>Veronica Canido</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
